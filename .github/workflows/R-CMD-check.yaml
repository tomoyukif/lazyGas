# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Bioconductor dependencies are required for GBScleanR / GDS I/O.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: "release"}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.rspm }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install Bioconductor and lazyGas dependencies
        run: |
          Rscript -e 'if (!requireNamespace("BiocManager", quietly = TRUE)) install.packages("BiocManager")'
          Rscript -e 'BiocManager::install(c(
            "gdsfmt", "SeqArray", "SNPRelate", "GenomicRanges", "IRanges",
            "S4Vectors", "GenomeInfoDb", "rtracklayer", "BiocGenerics"
          ), ask = FALSE, update = FALSE)'
          Rscript -e 'if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")'
          Rscript -e 'remotes::install_github("tomoyukif/GBScleanR", upgrade = "never")'
          Rscript -e 'install.packages(c(
            "gaston", "arrow", "jsonlite", "ggplot2", "cowplot", "dplyr",
            "parameters", "vcfR", "plotly", "reactable", "htmltools",
            "htmlwidgets", "testthat", "text2vec"
          ), repos = "https://cloud.r-project.org")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
