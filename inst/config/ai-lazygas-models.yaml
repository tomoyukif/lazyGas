# Deterministic ranking config (no LLM)
# Annotation (when in sources) always uses keyword matching.
# Default channel weights when a source is active (renormalized over
# active sources at ranking time). finemap / literature / ortholog are
# opt-in but keep defaults here for when they are enabled.
weights:
  annotation: 0.30
  snpeff: 0.35
  gwas_dist: 0.125
  gwas_peak: 0.125
  expression: 0.10
  finemap: 0.50
  literature: 0.50
  ortholog: 0.50
